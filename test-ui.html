<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph RLM - UI Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 12px 16px;
            border-bottom: 1px solid #3e3e42;
            background-color: #252526;
            flex-shrink: 0;
        }

        .header h2 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            word-break: break-word;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background-color: #464647;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background-color: #5a5a5a;
        }

        .message {
            display: flex;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 13px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .user .message-content {
            background-color: #007acc;
            color: #fff;
            border-radius: 12px;
        }

        .assistant .message-content {
            background-color: #2d2d30;
            color: #d4d4d4;
            border: 1px solid #3e3e42;
            border-radius: 8px;
        }

        /* Input area fixed at bottom */
        .input-container {
            padding: 12px 16px 16px 16px;
            border-top: 1px solid #3e3e42;
            background-color: #252526;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            min-width: 0;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #464647;
            border-radius: 6px;
            background-color: #3c3c3c;
            color: #d4d4d4;
            font-size: 13px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            resize: none;
            max-height: 80px;
            line-height: 1.4;
            min-height: 34px;
        }

        textarea:focus {
            outline: none;
            border-color: #007acc;
            box-shadow: 0 0 0 1px #007acc;
        }

        textarea::placeholder {
            color: #858585;
        }

        button {
            padding: 6px 14px;
            border: 1px solid #464647;
            background-color: #0e639c;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s ease;
            flex-shrink: 0;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: #1177bb;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6a9955;
            text-align: center;
            gap: 12px;
            padding: 20px;
        }

        .emoji {
            font-size: 48px;
            opacity: 0.8;
        }

        .empty-state-title {
            font-size: 14px;
            font-weight: 500;
            color: #d4d4d4;
        }

        .empty-state-hint {
            font-size: 12px;
            color: #858585;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🤖 Ralph RLM</h2>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="empty-state">
                <div class="emoji">🤖</div>
                <div class="empty-state-title">Ralph RLM</div>
                <div class="empty-state-hint">Ask me anything to get started</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="input" placeholder="Ask Ralph..." rows="1"></textarea>
                <button id="send" title="Send message (Ctrl+Enter)">Send</button>
            </div>
            <button id="clear" title="Clear chat history">Clear</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const clearBtn = document.getElementById('clear');

        let hasMessages = false;

        // Auto-resize textarea
        function autoResizeTextarea() {
            inputEl.style.height = 'auto';
            const newHeight = Math.min(inputEl.scrollHeight, 80);
            inputEl.style.height = newHeight + 'px';
        }

        inputEl.addEventListener('input', autoResizeTextarea);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (e.ctrlKey || e.metaKey) {
                    // Ctrl+Enter or Cmd+Enter: insert newline
                    return;
                } else if (!e.shiftKey) {
                    // Enter alone: send message
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        function clearEmptyState() {
            if (!hasMessages) {
                messagesDiv.innerHTML = '';
                hasMessages = true;
            }
        }

        function addMessage(text, isUser) {
            clearEmptyState();
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageEl.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            messagesDiv.appendChild(messageEl);
            
            // Auto scroll to bottom - ensure it scrolls to the very end
            requestAnimationFrame(() => {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendMessage() {
            const message = inputEl.value.trim();
            if (message) {
                addMessage(message, true);
                // Simulate a response from Ralph
                setTimeout(() => {
                    addMessage(`Ralph received: "${message}". This is a test response.`, false);
                }, 500);
                inputEl.value = '';
                inputEl.style.height = 'auto';
                inputEl.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        clearBtn.addEventListener('click', () => {
            messagesDiv.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🤖</div>
                    <div class="empty-state-title">Ralph RLM</div>
                    <div class="empty-state-hint">Ask me anything to get started</div>
                </div>
            `;
            hasMessages = false;
            inputEl.value = '';
            inputEl.style.height = 'auto';
        });

        // Focus input on load
        inputEl.focus();
    </script>
</body>
</html>
