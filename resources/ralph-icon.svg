<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="vGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9FFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D7BF5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main V letter (bold strokes) -->
  <path d="M 20 20 L 48 100 M 108 20 L 80 100" stroke="url(#vGradient)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chat bubble integration - left bubble -->
  <ellipse cx="42" cy="110" rx="18" ry="16" fill="#5B9FFF" opacity="0.9"/>
  
  <!-- Chat bubble integration - right bubble -->
  <ellipse cx="86" cy="110" rx="18" ry="16" fill="#3D7BF5" opacity="0.85"/>
  
  <!-- Chat tail - left -->
  <path d="M 30 118 L 22 128 L 28 120" fill="#5B9FFF"/>
  
  <!-- Chat tail - right -->
  <path d="M 98 118 L 106 128 L 100 120" fill="#3D7BF5"/>
  
  <!-- Accent dot in V center (represents connection/chat focus) -->
  <circle cx="64" cy="55" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
