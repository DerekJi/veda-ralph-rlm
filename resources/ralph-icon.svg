<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Robot head -->
  <rect x="24" y="24" width="80" height="80" rx="8" fill="#4A90E2" opacity="0.8"/>
  
  <!-- Eyes -->
  <circle cx="44" cy="44" r="8" fill="#ffffff"/>
  <circle cx="84" cy="44" r="8" fill="#ffffff"/>
  
  <!-- Pupils -->
  <circle cx="46" cy="46" r="4" fill="#4A90E2"/>
  <circle cx="86" cy="46" r="4" fill="#4A90E2"/>
  
  <!-- Mouth -->
  <path d="M 44 70 Q 64 80 84 70" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Antenna -->
  <line x1="64" y1="24" x2="64" y2="8" stroke="#4A90E2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="4" r="3" fill="#4A90E2"/>
</svg>
