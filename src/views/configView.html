<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph RLM Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--vscode-editor-background, #1e1e1e);
            color: var(--vscode-editor-foreground, #d4d4d4);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 100%;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--vscode-sideBar-foreground, #d4d4d4);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-icon {
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--vscode-input-placeholderForeground, #858585);
        }

        select {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--vscode-input-background, #3c3c3c);
            color: var(--vscode-input-foreground, #d4d4d4);
            border: 1px solid var(--vscode-input-border, #464647);
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:hover {
            border-color: var(--vscode-focusBorder, #007acc);
        }

        select:focus {
            outline: none;
            border-color: var(--vscode-focusBorder, #007acc);
            box-shadow: 0 0 0 1px var(--vscode-focusBorder, #007acc);
        }

        .models-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background-color: var(--vscode-sideBar-background, #252526);
            border-radius: 4px;
            border: 1px solid var(--vscode-input-border, #464647);
        }

        .model-item {
            padding: 8px 12px;
            background-color: var(--vscode-input-background, #3c3c3c);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }

        .model-item:hover {
            background-color: var(--vscode-list-hoverBackground, #454545);
        }

        .model-item.selected {
            background-color: var(--vscode-list-activeSelectionBackground, #0e639c);
            color: var(--vscode-list-activeSelectionForeground, #fff);
            border-color: var(--vscode-focusBorder, #007acc);
        }

        .model-item-radio {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--vscode-input-border, #464647);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .model-item.selected .model-item-radio {
            border-color: var(--vscode-focusBorder, #007acc);
            background-color: var(--vscode-focusBorder, #007acc);
        }

        .model-item.selected .model-item-radio::after {
            content: '';
            width: 4px;
            height: 4px;
            background-color: var(--vscode-list-activeSelectionBackground, #0e639c);
            border-radius: 50%;
        }

        .loading {
            display: inline-block;
            font-size: 12px;
            color: var(--vscode-input-placeholderForeground, #858585);
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--vscode-input-placeholderForeground, #858585);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .status-message.info {
            background-color: var(--vscode-inputValidation-infoBorder, #1f3e4d);
            color: var(--vscode-input-foreground, #4fc1ff);
        }

        .status-message.warning {
            background-color: var(--vscode-inputValidation-warningBorder, #433f1d);
            color: var(--vscode-input-foreground, #dcdcaa);
        }

        .model-name {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Provider Section -->
        <div class="section">
            <div class="section-title">
                <span class="section-icon">🤖</span>
                LLM Provider
            </div>
            
            <div class="form-group">
                <label for="provider-select">Select Provider:</label>
                <select id="provider-select">
                    <option value="">Loading providers...</option>
                </select>
                <div id="provider-status" class="status-message info" style="display: none;"></div>
            </div>
        </div>

        <!-- Model Section -->
        <div class="section">
            <div class="section-title">
                <span class="section-icon">✨</span>
                Model
            </div>

            <div id="model-container">
                <div class="loading">
                    <span class="spinner"></span> Loading models...
                </div>
            </div>
        </div>
    </div>

    <script>
        // This will be overridden in test environment
        // In actual VS Code extension, acquireVsCodeApi() is available
        let vscode;
        const isTestMode = typeof acquireVsCodeApi === 'undefined';

        try {
            vscode = acquireVsCodeApi();
        } catch {
            // Test environment - mock vscode API
            vscode = {
                postMessage: (msg) => {
                    console.log('Mock postMessage:', msg);
                    // Dispatch custom event for testing
                    window.dispatchEvent(new CustomEvent('webview-message', { detail: msg }));
                }
            };
        }

        // Persistence helpers
        const storage = {
            getProvider() {
                if (isTestMode) {
                    return localStorage.getItem('ralph-llm-provider') || 'github-copilot';
                }
                return 'github-copilot'; // In real mode, comes from VS Code settings
            },
            getModel() {
                if (isTestMode) {
                    return localStorage.getItem('ralph-llm-model') || 'gpt-4o';
                }
                return 'gpt-4o'; // In real mode, comes from VS Code settings
            },
            setProvider(provider) {
                if (isTestMode) {
                    localStorage.setItem('ralph-llm-provider', provider);
                }
            },
            setModel(model) {
                if (isTestMode) {
                    localStorage.setItem('ralph-llm-model', model);
                }
            }
        };

        let currentConfig = {
            provider: storage.getProvider(),
            model: storage.getModel(),
            availableProviders: [],
            availableModels: []
        };

        // Test data for different providers
        const testModels = {
            'github-copilot': ['gpt-4.1', 'gpt-4o'],
            'ollama': [
                'huihui_ai/qwen3-abliterated:14b',
                'qwen3-coder:latest',
                'llama3.2:latest',
                'qwen2.5-coder:7b',
                'gemma4:e2b',
                'qwen2.5vl:3b',
                'Moondream:latest',
                'nomic-embed-text:latest',
                'bge-m3:latest',
                'qwen:7b-chat',
                'qwen3-coder:30b',
                'qwen3-vl:8b',
                'qwen3:8b',
                'deepseek-r1:32b',
                'mychen76/fin-r1:Q5'
            ]
        };

        const providerSelect = document.getElementById('provider-select');
        const modelContainer = document.getElementById('model-container');
        const providerStatus = document.getElementById('provider-status');

        // Initialize
        window.addEventListener('load', () => {
            vscode.postMessage({ type: 'ready' });
        });

        // Handle config data
        window.addEventListener('message', (event) => {
            const message = event.data;

            switch (message.type) {
                case 'config-data':
                    handleConfigData(message);
                    break;
                case 'models-updated':
                    updateModels(message);
                    break;
            }
        });

        function handleConfigData(message) {
            currentConfig = {
                provider: message.currentProvider,
                model: message.currentModel,
                availableProviders: message.availableProviders,
                availableModels: message.availableModels
            };

            // Save to storage in test mode
            if (isTestMode) {
                storage.setProvider(message.currentProvider);
                storage.setModel(message.currentModel);
            }

            // Update provider select
            providerSelect.innerHTML = '';
            message.availableProviders.forEach(provider => {
                const option = document.createElement('option');
                option.value = provider;
                option.textContent = getProviderLabel(provider);
                providerSelect.appendChild(option);
            });
            providerSelect.value = currentConfig.provider;

            // Update models
            renderModels(currentConfig.availableModels, currentConfig.model);

            // Show status if only one provider
            if (message.availableProviders.length === 1) {
                providerStatus.textContent = message.availableProviders[0] === 'ollama'
                    ? '✓ Ollama detected and available'
                    : 'Using GitHub Copilot as default';
                providerStatus.style.display = 'block';
            } else {
                providerStatus.style.display = 'none';
            }
        }

        function updateModels(message) {
            currentConfig.provider = message.provider;
            currentConfig.availableModels = message.models;
            currentConfig.model = message.selectedModel;
            
            // Save to storage in test mode
            if (isTestMode) {
                storage.setProvider(message.provider);
                storage.setModel(message.selectedModel);
            }
            
            renderModels(message.models, message.selectedModel);
        }

        function renderModels(models, selectedModel) {
            if (models.length === 0) {
                modelContainer.innerHTML = '<div class="status-message warning">No models available. Please install a model for the selected provider.</div>';
                return;
            }

            const modelsList = document.createElement('div');
            modelsList.className = 'models-list';

            models.forEach(model => {
                const item = document.createElement('div');
                item.className = 'model-item';
                if (model === selectedModel) {
                    item.classList.add('selected');
                }

                item.innerHTML = `
                    <div class="model-item-radio"></div>
                    <div class="model-name">${escapeHtml(model)}</div>
                `;

                item.addEventListener('click', () => {
                    selectModel(model);
                });

                modelsList.appendChild(item);
            });

            modelContainer.innerHTML = '';
            modelContainer.appendChild(modelsList);
        }

        function selectModel(model) {
            vscode.postMessage({
                type: 'model-changed',
                provider: currentConfig.provider,
                model: model
            });

            currentConfig.model = model;
            storage.setModel(model);
            renderModels(currentConfig.availableModels, model);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        providerSelect.addEventListener('change', (e) => {
            const newProvider = e.target.value;
            vscode.postMessage({
                type: 'provider-changed',
                provider: newProvider
            });

            storage.setProvider(newProvider);

            // In test mode, simulate the response
            if (isTestMode) {
                const models = testModels[newProvider] || [];
                const defaultModel = models.length > 0 ? models[0] : 'llama2';
                
                // Simulate backend response
                setTimeout(() => {
                    updateModels({
                        provider: newProvider,
                        models: models,
                        selectedModel: defaultModel
                    });
                }, 100);
            }
        });

        function getProviderLabel(provider) {
            const labels = {
                'github-copilot': 'GitHub Copilot',
                'ollama': 'Ollama'
            };
            return labels[provider] || provider;
        }

        // For testing: simulate config data if running in standalone mode
        if (isTestMode) {
            setTimeout(() => {
                const savedProvider = storage.getProvider();
                const savedModel = storage.getModel();
                handleConfigData({
                    currentProvider: savedProvider,
                    currentModel: savedModel,
                    availableProviders: ['github-copilot', 'ollama'],
                    availableModels: testModels[savedProvider] || []
                });
            }, 500);
        }
    </script>
</body>
</html>
